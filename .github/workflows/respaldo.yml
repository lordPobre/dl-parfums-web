name: Respaldo diario
on:
  schedule: [{ cron: "0 7 * * *" }]   # 04:00 Chile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: pg_dump (Postgres 17)
        env:
          URL: ${{ secrets.DATABASE_URL_PRODUCCION }}
        run: |
          test -n "$URL" || { echo "::error::DATABASE_URL_PRODUCCION vacío"; exit 1; }
          docker run --rm -e URL -v "$PWD:/b" postgres:17 \
            sh -c 'pg_dump "$URL" -Fc --no-owner --no-acl -f /b/respaldo.dump'
          ls -lh respaldo.dump

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_number }}
          path: respaldo.dump
          retention-days: 14