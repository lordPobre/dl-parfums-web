name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  navegador:
    name: Navegador (${{ matrix.navegador }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, webkit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: instinto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E: "1"
      E2E_NAVEGADOR: ${{ matrix.navegador }}
      DJANGO_SETTINGS_MODULE: core.settings_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/instinto
      SECRET_KEY: ci-solo-para-pruebas-9f3b7c1e5a2d8f4b6c0e7a9d1f3b5c7e9a2d4f6b8
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: ci
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-e2e.txt

      - name: Instalar ${{ matrix.navegador }}
        run: playwright install --with-deps ${{ matrix.navegador }}

      - name: Pruebas en navegador
        run: python manage.py test catalogo.tests_e2e --noinput --verbosity 2

      - name: Guardar capturas y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.navegador }}
          path: e2e-capturas/
          retention-days: 7
